<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>preview</title>
<style>
  html, body { margin: 0; background: #2c2c2c; }
  .frame { margin: 12px auto; background: #fff; box-shadow: 0 10px 40px rgba(0,0,0,.5); overflow: hidden; }
  iframe { border: 0; display: block; }
</style>
</head>
<body>
<div class="frame" id="frame"><iframe id="f" src="./index.html" title="preview" scrolling="yes"></iframe></div>
<script>
  var p = new URLSearchParams(location.search);
  var w = parseInt(p.get("w") || "390", 10);
  var h = parseInt(p.get("h") || "844", 10);
  var hash = p.get("s") || "";
  var lang = p.get("lang") || "ko";
  var fr = document.getElementById("frame");
  fr.style.width = w + "px";
  fr.style.height = h + "px";
  var f = document.getElementById("f");
  f.style.width = w + "px";
  f.style.height = h + "px";
  f.src = "./index.html?lang=" + lang + "&cb=" + Date.now() + (hash ? "#" + hash : "");
</script>
</body>
</html>
