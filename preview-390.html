<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>preview 390</title>
<style>
  html, body { margin: 0; background: #2c2c2c; }
  .frame { width: 390px; height: 844px; margin: 12px auto; background: #fff; box-shadow: 0 10px 40px rgba(0,0,0,.5); overflow: hidden; }
  iframe { width: 390px; height: 844px; border: 0; display: block; }
</style>
</head>
<body>
<div class="frame"><iframe id="f" src="./index.html" title="mobile preview" scrolling="yes"></iframe></div>
<script>
  var p = new URLSearchParams(location.search);
  var h = p.get("h") || "";
  var lang = p.get("lang") || "ko";
  document.getElementById("f").src = "./index.html?lang=" + lang + (h ? "#" + h : "");
</script>
</body>
</html>
